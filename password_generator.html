    <script>
// 定义需要的东西
const HASH_ENGINE = {
    main: "scrypt",
    engines: [
        { name: "scrypt_name_with_description", id: "scrypt" },
        { name: "bkdr_name_with_description", id: "bkdr" }
    ]
};
const STRING_ARGUMENT_LIST = [
    { name: "seed_string", id: "seed-string", default: "夏色まつりちゃんが大好き！", hiddenByDefault: true },
    { name: "modifier_string", id: "modifier-string", default: "gfw.report", hiddenByDefault: false },
    { name: "password_length", id: "password-length", default: "16", hiddenByDefault: false }
];

// 渲染页面
for (let engine of HASH_ENGINE.engines) {
    let inputId = `hash-engine-${engine.id}`;
    let container = document.createElement("li");
    container.className = "hash-engine";
    container.innerHTML = `
<label
    class="hash-engine-name"
    for="${inputId}"
    data-i18n-id="${engine.name}"
></label>
<input
    id="${inputId}"
    name="hash-engine"
    class="hash-engine-select"
    value="${engine.id}"
    type="radio"
    ${engine.id === HASH_ENGINE.main ? "checked" : ""}
>`;
    document.getElementById("hash-engine-list").appendChild(container);
}
for (let argument of STRING_ARGUMENT_LIST) {
    let argumentInputId = `${argument.id}-content`;
    let container = document.createElement("div");
    container.id = `${argument.id}-container`;
    container.innerHTML = `
<label
    for="${argumentInputId}"
    data-i18n-id="${argument.name}"
></label>
<input
    id="${argumentInputId}"
    name="${argument.id}"
    value="${argument.default}"
    type="${argument.hiddenByDefault ? "password": "text"}"
    data-default="${argument.default}"
    data-i18n-id="${argument.name}"
    data-i18n-attr="placeholder"
>
<button
    class="toggle-visibility"
    data-for="${argumentInputId}"
    data-i18n-id="toggle_visibility"
></button>`;
    document.getElementById("argument-container").appendChild(container);
}

// 文本输入和隐藏
for (let input of document.getElementsByTagName("input")) {
    if ((input.type !== "text" && input.type !== "password") || !input.hasAttribute("data-default")) continue;
    input.onfocus = (event) => {
        const target = event.currentTarget;
        target.value = target.value === target.attributes["data-default"].value ? "" : target.value; 
    };
    input.onblur = (event) => {
        const target = event.currentTarget;
        target.value = target.value === "" ? target.attributes["data-default"].value : target.value; 
    };
}

// 显示/隐藏文本
for (let button of document.getElementsByClassName("toggle-visibility"))
    button.onclick = event => {
        const inputId = event.currentTarget.attributes["data-for"].value;
        const inputElement = document.getElementById(inputId);
        inputElement.type = inputElement.type === "password" ? "text" : "password";
    };

// 复制生成的密码
document.getElementById("copy-password-button").onclick = () => navigator.clipboard.writeText(document.getElementById("output-password").value);

// 生成逻辑
function bkdrHash(string) {
    // 参见 Python 版 https://github.com/thiliapr/password_generator/blob/0400b452054b6ced8ff5230762df32e2e81467e0/password_generator.py
    const BKDR_HASH_SEED = 131;

    let hash_value = 0;
    for (let char of string) {
        hash_value = hash_value * BKDR_HASH_SEED + char.charCodeAt(0);
        hash_value &= 0x7FFFFFFF;
    }
    return hash_value;
}

function specialScryptHash(string) {
    function convert_hex_to_array(hex) { return new Uint8Array(hex.match(/.{1,2}/g).map(byte => parseInt(byte, 16))); }
    const sha3_512_result = convert_hex_to_array(sha3_512(string));
    const sha3_256_result = convert_hex_to_array(sha3_256(string));
    const scrypt_result = scrypt.syncScrypt(
        sha3_512_result,
        Array.from("June 4, 1989", char => char.charCodeAt(0)).concat(...sha3_256_result),
        Math.pow(2, 16),
        8,
        2,
        64
    );
    const result = scrypt_result.reduce((previousValue, currentValue) => (BigInt(previousValue) << 8n) + BigInt(currentValue));
    return result;
}

document.getElementById("generate-button").onclick = () => {
    // 当年不知道怎么想定的玩意，历史遗留设计
    const PASSWORD_CHARS = Array.from("0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ`_~@#$%^&*-=:;,.-");
    const BASE_NUMBER = 127n;  // 基数

    // 清空历史记录
    document.getElementById("output-password").value = "";

    // 解析参数
    const argument = Object.fromEntries(STRING_ARGUMENT_LIST.map(argument => [argument.id, document.getElementById(`${argument.id}-content`).value]));
    argument["password-length"] = parseInt(argument["password-length"]);
    argument["hash-engine"] = document.querySelector(`input[name="hash-engine"]:checked`).value;

    // 计算 seed 和 modifier 的哈希值，作为被除数和除数
    let hash_function = {
        bkdr: bkdrHash,
        scrypt: specialScryptHash
    }[argument["hash-engine"]];

    let seed_hash = BigInt(hash_function(argument["seed-string"]));
    const modifier_hash = BigInt(hash_function(argument["modifier-string"]));

    // 小学除法
    for (let i = 0; i < argument["password-length"]; i++) {
        quotient = seed_hash / modifier_hash;
        remainder = seed_hash % modifier_hash;
        seed_hash = remainder * BASE_NUMBER;
        document.getElementById("output-password").value += PASSWORD_CHARS[Number(quotient) % PASSWORD_CHARS.length];
    }
};

// 获取翻译
function getTextTranslate(textId, language) {
    return LANGUAGE_PACKS[language][textId] || LANGUAGE_PACKS[BACKUP_LANGUAGE][textId] || `_("${textId}")`;
}

// 页面适应国际化
// 添加语言为选项
for (let language of Object.keys(LANGUAGE_PACKS)) {
    let option = document.createElement("option");
    option.value = language;
    option.selected = language === DEFAULT_LANGUAGE;
    option.innerText = language;
    document.getElementById("language-select").appendChild(option);
}

// 检测语言变更，并初始化界面
function updateGUILanguage() {
    const language = document.getElementById("language-select").value;
    document.documentElement.lang = language;
    for (let element of document.querySelectorAll("[data-i18n-id]")) {
        // 内部文本
        let textId = element.attributes["data-i18n-id"].value;
        if (element.tagName.toLowerCase() !== "input") element.innerText = getTextTranslate(textId, language);

        // 有时属性也得翻译
        if (!element.hasAttribute("data-i18n-attr")) continue;
        for (let attributeToTranslate of element.attributes["data-i18n-attr"].value.split(","))
            element.setAttribute(attributeToTranslate, getTextTranslate(`${textId}:${attributeToTranslate}`, language));
    }
};
document.getElementById("language-select").onchange = updateGUILanguage;
updateGUILanguage();
